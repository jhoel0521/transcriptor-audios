# Compila Transcriptor para Windows, Mac y Linux.
# - En cada push o pull request: compila para comprobar que nada se rompió.
# - Al publicar una etiqueta de versión (ej. v1.0.0): además crea el Release con los 3 .zip para descargar.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Transcriptor-Windows
          - os: macos-latest
            nombre: Transcriptor-Mac
          - os: ubuntu-latest
            nombre: Transcriptor-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Comprobar que el código carga
        run: python -c "import transcribir"

      - name: Compilar
        run: python compilar.py

      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Transcriptor -DestinationPath ${{ matrix.nombre }}.zip

      - name: Comprimir (Mac)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Transcriptor.app ../${{ matrix.nombre }}.zip

      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qry ../${{ matrix.nombre }}.zip Transcriptor

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}.zip

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: Transcriptor-*.zip
          generate_release_notes: true
